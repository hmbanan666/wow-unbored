[package]
name = "unbored-companion"
version = "0.8.0"
edition = "2021"
rust-version = "1.88"
description = "Tray app that carries Unbored plans into World of Warcraft"
license = "MIT"
default-run = "unbored-companion"

[features]
default = ["gui"]
gui = [
  "dep:tauri",
  "dep:tauri-plugin-autostart",
  "dep:tauri-plugin-notification",
  "dep:tauri-plugin-dialog",
  "dep:tauri-plugin-updater",
  "dep:reqwest",
  "dep:notify",
  "dep:tokio",
]

[dependencies]
base64 = "0.23"
flate2 = "1"
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
zip = { version = "9.1", default-features = false, features = ["deflate"] }
tauri = { version = "2.12", optional = true, features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = { version = "2.7", optional = true }
tauri-plugin-notification = { version = "2.8", optional = true }
tauri-plugin-dialog = { version = "2.8", optional = true }
tauri-plugin-updater = { version = "2.14", optional = true }
reqwest = { version = "0.13", optional = true, default-features = false, features = ["json", "rustls", "blocking"] }
notify = { version = "8", optional = true }
tokio = { version = "1", optional = true, features = ["macros", "rt-multi-thread", "time"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "4", features = ["v1"] }
winreg = "0.56"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dev-dependencies]
jsonschema = "0.60"
