name: Lint

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  addon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/companion/src-tauri -> target

      - name: Install Lua 5.1 and luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 lua-check

      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install, lint, and test
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm test
          pnpm check-version

      - name: Updater feed keeps the shape installed Companions read
        run: |
          dir="$(mktemp -d)"
          echo sig-nsis > "$dir/setup.sig"
          echo sig-msi > "$dir/app.sig"
          : > "$dir/Unbored.Companion_9.9.9_x64-setup.exe"
          : > "$dir/Unbored.Companion_9.9.9_x64_en-US.msi"
          bash .github/scripts/updater-json.sh 9.9.9 hmbanan666/wow-unbored \
            "$dir/Unbored.Companion_9.9.9_x64-setup.exe" "$dir/setup.sig" \
            "$dir/Unbored.Companion_9.9.9_x64_en-US.msi" "$dir/app.sig" > "$dir/latest.json"
          python3 - "$dir/latest.json" <<'PY'
          import json, sys
          doc = json.load(open(sys.argv[1]))
          assert set(doc) == {"version", "notes", "pub_date", "platforms"}
          assert set(doc["platforms"]) == {"windows-x86_64", "windows-x86_64-nsis", "windows-x86_64-msi"}
          nsis = doc["platforms"]["windows-x86_64"]
          assert nsis["url"] == "https://github.com/hmbanan666/wow-unbored/releases/download/v9.9.9/Unbored.Companion_9.9.9_x64-setup.exe"
          assert doc["platforms"]["windows-x86_64-nsis"]["url"] == nsis["url"]
          assert doc["platforms"]["windows-x86_64-msi"]["url"].endswith(".msi")
          assert nsis["signature"] == "sig-nsis"
          print("updater json shape ok")
          PY

  release-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Release notes are for players (D116)
        run: |
          pipx install git-cliff==2.14.2
          bash scripts/test-release-notes.sh v0.6.0
          bash scripts/test-release-notes.sh v0.7.0
          bash scripts/test-release-notes.sh v0.8.0
