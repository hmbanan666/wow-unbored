name: Lint

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  addon:
    runs-on: ubuntu-26.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/companion/src-tauri -> target

      - name: Install Lua 5.1, luacheck and minisign
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 lua-check minisign

      - uses: pnpm/action-setup@v6
        with:
          version: 12.16.1
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install, lint, and test
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm test
          pnpm check-version

      - name: Website pages come from Postgres
        run: UNBORED_WEB_TEST_DATABASE_URL=postgres://postgres:postgres@localhost:5432/postgres pnpm exec vp test apps/web

      - name: Website production SEO and navigation
        run: UNBORED_TEST_DATABASE_URL=postgres://postgres:postgres@localhost:5432/postgres pnpm --filter @unbored/web test:seo

      - name: Website image serves /ready
        run: |
          docker build -f apps/web/Dockerfile -t unbored-web .
          docker run -d --name unbored-web -p 3996:3000 \
            -e NUXT_APP_SECRET=ci-app-secret-not-a-secret-value-000000 \
            unbored-web
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3996/ready; then
              docker rm -f unbored-web
              exit 0
            fi
            sleep 1
          done
          docker logs unbored-web
          exit 1

      - name: Release checks catch a wrong updater key and a cold Windows cache
        run: |
          bash .github/scripts/test-verify-updater-sigs.sh
          bash .github/scripts/check-rust-cache.sh

      - name: Updater feed keeps the shape installed Companions read
        run: |
          dir="$(mktemp -d)"
          echo sig-nsis > "$dir/setup.sig"
          echo sig-msi > "$dir/app.sig"
          : > "$dir/Unbored.Companion_9.9.9_x64-setup.exe"
          : > "$dir/Unbored.Companion_9.9.9_x64_en-US.msi"
          bash .github/scripts/updater-json.sh 9.9.9 hmbanan666/wow-unbored \
            "$dir/Unbored.Companion_9.9.9_x64-setup.exe" "$dir/setup.sig" \
            "$dir/Unbored.Companion_9.9.9_x64_en-US.msi" "$dir/app.sig" > "$dir/latest.json"
          python3 - "$dir/latest.json" <<'PY'
          import json, sys
          doc = json.load(open(sys.argv[1]))
          assert set(doc) == {"version", "notes", "pub_date", "platforms"}
          assert set(doc["platforms"]) == {"windows-x86_64", "windows-x86_64-nsis", "windows-x86_64-msi"}
          nsis = doc["platforms"]["windows-x86_64"]
          assert nsis["url"] == "https://github.com/hmbanan666/wow-unbored/releases/download/v9.9.9/Unbored.Companion_9.9.9_x64-setup.exe"
          assert doc["platforms"]["windows-x86_64-nsis"]["url"] == nsis["url"]
          assert doc["platforms"]["windows-x86_64-msi"]["url"].endswith(".msi")
          assert nsis["signature"] == "sig-nsis"
          print("updater json shape ok")
          PY

  release-notes:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Release notes are for players (D116)
        run: |
          pipx install git-cliff==2.14.2
          bash scripts/test-release-notes.sh v0.6.0
          bash scripts/test-release-notes.sh v0.7.0
          bash scripts/test-release-notes.sh v0.8.0
