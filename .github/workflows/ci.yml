name: Lint

on:
  push:
  pull_request:

jobs:
  luacheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.1 and luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 lua-check

      - name: Luacheck
        run: luacheck .

      - name: Tests
        run: lua5.1 tests/run.lua
      - name: Window layout
        run: lua5.1 tests/ui.lua
