name: Companion

on:
  pull_request:
    paths:
      - "apps/companion/**"
      - "packages/contracts/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/companion.yml"
      - "scripts/check-companion-dist.sh"
      - ".github/scripts/collect-bundle.sh"
      - "docs/companion-api.md"
      - "docs/contract/**"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/companion/src-tauri -> target
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - name: Format, clippy, and library tests
        run: pnpm install --frozen-lockfile && pnpm run lint:companion && pnpm test:companion

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # The release job restores this same cache (D216); only main saves it.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/companion/src-tauri -> target
          shared-key: companion-windows
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - name: Install the workspace
        shell: bash
        run: pnpm install --frozen-lockfile
      - name: Choose signing
        id: sign
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          key="$(printf '%s' "$KEY" | tr -d '[:space:]')"
          if [ -n "$key" ]; then
            echo "::add-mask::$key"
            echo "TAURI_SIGNING_PRIVATE_KEY=$key" >> "$GITHUB_ENV"
            echo "args=--bundles msi,nsis" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set. Building without updater artifacts."
            root="${GITHUB_WORKSPACE//\\//}"
            echo "args=--bundles msi,nsis --config ${root}/apps/companion/src-tauri/tauri.unsigned.conf.json" >> "$GITHUB_OUTPUT"
          fi
      - name: Build installer without publishing
        working-directory: apps/companion
        shell: bash
        run: pnpm exec tauri build ${{ steps.sign.outputs.args }}
      - name: Check the window ships every Bory picture
        shell: bash
        run: scripts/check-companion-dist.sh apps/companion/dist
      # After the build, so dist/ exists for the bin's generate_context (D118).
      - name: Clippy on every target and feature
        shell: bash
        run: pnpm run lint:companion:all
