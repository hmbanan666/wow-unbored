name: Companion

on:
  pull_request:
    paths:
      - "apps/companion/**"
      - "packages/contracts/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/companion.yml"
      - "docs/companion-api.md"
      - "docs/contract/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Format, clippy, and library tests
        run: |
          cargo fmt --manifest-path apps/companion/src-tauri/Cargo.toml -- --check
          cargo clippy --manifest-path apps/companion/src-tauri/Cargo.toml --lib --no-default-features -- -D warnings
          cargo test --manifest-path apps/companion/src-tauri/Cargo.toml --lib --no-default-features

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install the workspace
        shell: bash
        run: corepack enable && corepack prepare pnpm@10.33.4 --activate && pnpm install --frozen-lockfile
      - name: Choose signing
        id: sign
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          key="$(printf '%s' "$KEY" | tr -d '[:space:]')"
          if [ -n "$key" ]; then
            echo "::add-mask::$key"
            echo "TAURI_SIGNING_PRIVATE_KEY=$key" >> "$GITHUB_ENV"
            echo "args=--bundles msi,nsis" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set. Building without updater artifacts."
            root="${GITHUB_WORKSPACE//\\//}"
            echo "args=--bundles msi,nsis --config ${root}/apps/companion/src-tauri/tauri.unsigned.conf.json" >> "$GITHUB_OUTPUT"
          fi
      - name: Build installer without publishing
        working-directory: apps/companion
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm exec tauri build ${{ steps.sign.outputs.args }}
