name: Server

on:
  pull_request:
    paths:
      - "apps/server/**"
      - "packages/contracts/**"
      - "addon/Core/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/server.yml"
      - "docs/companion-api.md"
      - "docs/contract/**"
      - "docs/plan-format.md"
  push:
    branches:
      - main
    paths:
      - "apps/server/**"
      - "packages/contracts/**"
      - "addon/Core/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/server.yml"
      - "docs/companion-api.md"
      - "docs/contract/**"
      - "docs/plan-format.md"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@10.33.4 --activate
      - name: Lua decoder used by the plan roundtrip
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Install, check, and test
        run: pnpm install --frozen-lockfile && pnpm exec vp check && pnpm exec vp test
      - name: Docker image
        run: docker build -f apps/server/Dockerfile -t unbored-server .
