name: Server

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "apps/server/**"
      - "packages/contracts/**"
      - "addon/Core/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/server.yml"
      - "scripts/server-smoke.sh"
      - "docs/companion-api.md"
      - "docs/contract/**"
      - "docs/plan-format.md"
  push:
    branches:
      - main
    paths:
      - "apps/server/**"
      - "packages/contracts/**"
      - "addon/Core/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/server.yml"
      - "scripts/server-smoke.sh"
      - "docs/companion-api.md"
      - "docs/contract/**"
      - "docs/plan-format.md"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - name: Lua decoder used by the plan roundtrip
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Install, check, and test
        run: |
          pnpm install --frozen-lockfile
          pnpm run lint:js
          pnpm test:js
          pnpm typecheck
      - name: Start like the Dockerfile and answer /health
        run: scripts/server-smoke.sh
      - name: Docker image
        run: docker build -f apps/server/Dockerfile -t unbored-server .
      - name: Docker image answers /health
        run: |
          docker run -d --name unbored-smoke -p 3998:3000 \
            -e UNBORED_COMPANION_TOKEN=smoke-companion -e UNBORED_PLANNER_TOKEN=smoke-planner \
            unbored-server
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3998/health; then
              docker rm -f unbored-smoke
              exit 0
            fi
            sleep 1
          done
          docker logs unbored-smoke
          exit 1
