name: Release

# Builds a retail zip with the BigWigs packager when a tag is pushed.
# CurseForge and Wago are left unset until those projects exist.
# https://warcraft.wiki.gg/wiki/Using_the_BigWigs_Packager_with_GitHub_Actions

on:
  push:
    tags:
      # Addon releases only. companion-v* is the tray app and must not
      # publish an addon zip onto that same GitHub release.
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: BigWigsMods/packager@v2
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

      # The packager pastes the whole CHANGELOG.md; a release says only what
      # changed in it, after a short Install section (docs/adr/0022).
      - name: Release notes for this version only
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          pipx install git-cliff==2.14.2
          .github/scripts/release-notes.sh addon "$TAG" > notes.md
          cat notes.md
          gh release edit "$TAG" --notes-file notes.md
