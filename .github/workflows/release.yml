name: Release

# One tag vX.Y.Z publishes the addon zip, the Companion installer, and the
# updater feed. Installed Companions keep reading latest.json from the
# companion-updater release (docs/adr/0026). Do not tag companion-v*.
#
# Run it by hand (workflow_dispatch) for a dry run (D117): the same builds,
# asset names, latest.json check and release notes, uploaded as workflow
# artifacts only. Nothing is published unless the ref is a v* tag and it is
# a tag push or a manual run with dry_run off.

on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and check everything, publish nothing"
        type: boolean
        default: true

permissions:
  contents: write

env:
  PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.dry_run == false) }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: The version this run releases
        id: pick
        run: |
          set -euo pipefail
          if [ "$PUBLISH" = "true" ]; then
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
          else
            version="$(jq -r .version apps/companion/src-tauri/tauri.conf.json)"
            tag="v${version}"
          fi
          echo "Releasing ${version} (publish: ${PUBLISH})"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  addon:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Lay the addon out where the packager looks
        run: bash scripts/stage-addon.sh

      # A re-run, or a tag pushed again, finds the release from the earlier
      # run (deleting a tag turns its release into a draft). Start clean so
      # the packager makes exactly one release and no asset is duplicated.
      - name: Remove an earlier release of this tag
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"${TAG}\") | .id" |
            while read -r id; do
              echo "Removing release ${id} left by an earlier run of ${TAG}"
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${id}"
            done

      - uses: BigWigsMods/packager@v2
        if: env.PUBLISH == 'true'
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

      - name: Package without uploading
        if: env.PUBLISH != 'true'
        uses: BigWigsMods/packager@v2
        with:
          args: -d

      - name: Name the zip as the release would
        if: env.PUBLISH != 'true'
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          zips=(.release/*.zip)
          if [ "${#zips[@]}" -ne 1 ]; then
            echo "::error::expected one addon zip, found ${#zips[@]}"
            ls -la .release || true
            exit 1
          fi
          mkdir -p dry-run
          cp "${zips[0]}" "dry-run/Unbored-v${VERSION}.zip"
          unzip -l "dry-run/Unbored-v${VERSION}.zip" | grep -q " Unbored/Unbored.toc$" || {
            echo "::error::the zip has no Unbored/Unbored.toc"
            exit 1
          }

      - uses: actions/upload-artifact@v7
        if: env.PUBLISH != 'true'
        with:
          name: dry-run-addon
          if-no-files-found: error
          path: dry-run/*.zip

  companion:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install the workspace
        shell: bash
        run: corepack enable && corepack prepare pnpm@10.33.4 --activate && pnpm install --frozen-lockfile
      - name: Choose signing
        id: sign
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          key="$(printf '%s' "$KEY" | tr -d '[:space:]')"
          if [ -n "$key" ]; then
            echo "::add-mask::$key"
            echo "TAURI_SIGNING_PRIVATE_KEY=$key" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "args=--bundles msi,nsis" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set. The installer will be built, and the updater feed will be left as it is."
            root="${GITHUB_WORKSPACE//\\//}"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "args=--bundles msi,nsis --config ${root}/apps/companion/src-tauri/tauri.unsigned.conf.json" >> "$GITHUB_OUTPUT"
          fi
      - name: Build installer
        working-directory: apps/companion
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm exec tauri build ${{ steps.sign.outputs.args }}
      - name: Check the window ships every Bory picture
        shell: bash
        run: scripts/check-companion-dist.sh apps/companion/dist
      - name: Upload the installer
        uses: actions/upload-artifact@v7
        with:
          name: companion-bundle
          if-no-files-found: error
          path: |
            apps/companion/src-tauri/target/release/bundle/nsis/*.exe
            apps/companion/src-tauri/target/release/bundle/nsis/*.sig
            apps/companion/src-tauri/target/release/bundle/msi/*.msi
            apps/companion/src-tauri/target/release/bundle/msi/*.sig
      - name: Remember whether this build is signed
        shell: bash
        run: echo "${{ steps.sign.outputs.signed }}" > signed.txt
      - uses: actions/upload-artifact@v7
        with:
          name: companion-signed
          path: signed.txt

  publish:
    needs: [version, addon, companion]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: companion-*
          merge-multiple: true
          path: bundle
      - name: Check the installer names and the updater feed
        id: collect
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          bash .github/scripts/collect-bundle.sh "$VERSION" "${GITHUB_REPOSITORY}" bundle | tee collect.log
          tail -n 1 collect.log >> "$GITHUB_OUTPUT"
      - name: Attach the installer and refresh the updater feed
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          SIGNED: ${{ steps.collect.outputs.signed }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(bundle/*.exe bundle/*.msi bundle/*.sig)
          gh release upload "$TAG" "${files[@]}" --clobber
          if [ "$SIGNED" != "true" ]; then
            echo "Updater feed left unchanged."
            exit 0
          fi
          gh release upload "$TAG" bundle/latest.json --clobber
          if ! gh release view companion-updater >/dev/null 2>&1; then
            gh release create companion-updater --prerelease --target "$GITHUB_SHA" \
              --title "Companion self-update feed" \
              --notes "Holds latest.json for Companions already installed. Do not delete."
          fi
          gh release upload companion-updater bundle/latest.json --clobber
      - uses: actions/upload-artifact@v7
        if: env.PUBLISH != 'true'
        with:
          name: dry-run-companion
          if-no-files-found: error
          path: |
            bundle/*.exe
            bundle/*.msi
            bundle/*.sig
            bundle/latest.json

  # Runs once the addon job made the release, so a failed installer upload
  # never leaves the packager's full CHANGELOG as the release body.
  notes:
    needs: [version, addon]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Release notes for this version only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          pipx install git-cliff==2.14.2
          if [ "$PUBLISH" = "true" ]; then
            bash .github/scripts/release-notes.sh "$TAG" > notes.md
          else
            bash .github/scripts/release-notes.sh HEAD "$VERSION" > notes.md
          fi
          cat notes.md
          if [ "$PUBLISH" = "true" ]; then
            gh release edit "$TAG" --notes-file notes.md
          fi
      - uses: actions/upload-artifact@v7
        if: env.PUBLISH != 'true'
        with:
          name: dry-run-notes
          path: notes.md
