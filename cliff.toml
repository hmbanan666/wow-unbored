# Release notes for one release only (docs/adr/0022, docs/adr/0026, 0041).
# One tag vX.Y.Z includes every scope. NOTES_SCOPE is unused by the
# release script; "addon" and "companion" remain for a local preview.
# Squash merges keep each commit as one "* type(scope): ..." line in the
# body, so split_commits turns every line into its own entry. git-cliff
# parses the whole commit before it splits it, so a skip parser that
# matches the squash title ("chore: ...") drops every line of the squash.
# Nothing here skips by type: maintenance types land in a hidden group the
# template leaves out. The template also drops the "chore(release)" line,
# a title that starts with a version ("feat: v0.8.0 ..."), and a squash
# title whose body already lists player lines. Players see Features, Fixes
# and Performance only (D114); a line already shown, in any group, is not
# shown again (D115).

[changelog]
header = ""
body = """
{% set only = get_env(name="NOTES_SCOPE", default="") -%}
{% set all = commits -%}
{% set_global seen = [] -%}
{% for group, commits in commits | group_by(attribute="group") -%}
{% if group is containing("Maintenance") %}{% continue %}{% endif -%}
{% set_global shown = [] -%}
{% for commit in commits -%}
{% if commit.scope == "release" %}{% continue %}{% endif -%}
{% set family = all | filter(attribute="id", value=commit.id) -%}
{% set head = family | first -%}
{% if family | length > 1 and head.message == commit.message -%}
{% set_global players = 0 -%}
{% for sibling in family %}{% if sibling.group is not containing("Maintenance") %}{% set_global players = players + 1 %}{% endif %}{% endfor -%}
{% if players > 1 %}{% continue %}{% endif -%}
{% endif -%}
{% if only == "companion" and commit.scope != "companion" %}{% continue %}{% endif -%}
{% if only == "addon" and commit.scope in ["companion", "server"] %}{% continue %}{% endif -%}
{% set line = commit.message | split(pat="\n") | first | trim | lower | trim_end_matches(pat=".") | trim -%}
{% if line is matching("^v?[0-9]+\\.[0-9]+") %}{% continue %}{% endif -%}
{% if line in seen %}{% continue %}{% endif -%}
{% set_global seen = seen | concat(with=line) -%}
{% set_global shown = shown | concat(with=commit) -%}
{% endfor -%}
{% if shown | length > 0 %}
### {{ group | striptags | trim }}
{% for commit in shown %}
- {{ commit.message | split(pat="\n") | first | trim | upper_first }} \
([{{ commit.id | truncate(length=7, end="") }}](https://github.com/hmbanan666/wow-unbored/commit/{{ commit.id }}))
{%- endfor %}
{% endif -%}
{% endfor %}
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = true
protect_breaking_commits = false
filter_commits = true
sort_commits = "oldest"
tag_pattern = "^v[0-9]"
commit_preprocessors = [
  { pattern = '^\s*[*-]\s+', replace = "" },
  { pattern = '\s*\(#\d+\)\s*$', replace = "" },
]
commit_parsers = [
  { message = "^[A-Za-z-]+-by:", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^(refactor|docs|chore|test|ci|build|style|revert)", group = "<!-- 9 -->Maintenance" },
]
