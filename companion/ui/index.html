<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Unbored</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body data-phase="idle">
  <main>
    <div class="mascot">
      <div class="halo"></div>
      <img id="mascot" src="img/wisp-idle.png" alt="" draggable="false" />
    </div>
    <h1 id="headline">Hello!</h1>
    <p id="hint"></p>

    <div id="setup" class="actions" hidden>
      <button id="pick" class="big" type="button">Choose folder</button>
      <button id="detect" type="button">Look again</button>
    </div>

    <label class="check"><input id="autostart" type="checkbox" /> Start with Windows</label>
  </main>

  <details>
    <summary>Advanced</summary>
    <p id="status"></p>
    <p id="addon"></p>
    <label>Retail folder
      <input id="wow" type="text" spellcheck="false" placeholder="C:\Program Files (x86)\World of Warcraft\_retail_" />
    </label>
    <button id="use-path" type="button">Use this folder</button>
    <label>Planner URL
      <input id="url" type="url" spellcheck="false" placeholder="https://unbored.kosarev.space" />
    </label>
    <label>Poll every
      <input id="poll" type="number" min="0" max="240" value="5" /> minutes (0 = the automatic check only)
    </label>
    <button id="save-endpoint" type="button">Save</button>
    <label>Plan string
      <textarea id="plan" rows="3" spellcheck="false" placeholder="UNB1:..."></textarea>
    </label>
    <button id="write" type="button">Write plan</button>
    <button id="fetch" type="button">Fetch plan</button>
    <button id="rescan" type="button">Read progress</button>
    <ul id="progress"></ul>
    <p id="version"></p>
  </details>
  <script src="app.js"></script>
</body>
</html>
