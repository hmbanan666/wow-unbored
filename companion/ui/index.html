<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Unbored Companion</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <header>
    <h1>Unbored</h1>
    <p>Installs the addon, waits for this PC to be approved, then keeps the plan in sync.</p>
  </header>
  <p id="pairing"></p>
  <p id="addon"></p>
  <div id="need-path" hidden>
    <label>Retail folder <input id="wow" type="text" spellcheck="false" placeholder="_retail_ folder" /></label>
    <button id="use-path" type="button">Use this folder</button>
  </div>
  <label class="check"><input id="autostart" type="checkbox" /> Start with Windows</label>
  <button id="rescan" type="button">Read progress</button>
  <p id="status"></p>
  <ul id="progress"></ul>
  <details>
    <summary>Advanced</summary>
    <label>Planner URL
      <input id="url" type="url" spellcheck="false" placeholder="https://unbored.kosarev.space" />
    </label>
    <label>Poll every
      <input id="poll" type="number" min="0" max="240" value="5" /> minutes (0 = the automatic check only)
    </label>
    <button id="save-endpoint" type="button">Save</button>
    <label>Plan string
      <textarea id="plan" rows="4" spellcheck="false" placeholder="UNB1:..."></textarea>
    </label>
    <button id="write" type="button">Write plan</button>
    <button id="fetch" type="button">Fetch plan</button>
  </details>
  <script src="app.js"></script>
</body>
</html>
