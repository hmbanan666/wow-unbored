[package]
name = "unbored-companion"
version = "0.4.0"
edition = "2021"
rust-version = "1.77"
description = "Tray app that carries Unbored plans into World of Warcraft"
license = "MIT"
default-run = "unbored-companion"

[features]
default = ["gui"]
gui = [
  "dep:tauri",
  "dep:tauri-plugin-autostart",
  "dep:tauri-plugin-notification",
  "dep:tauri-plugin-dialog",
  "dep:tauri-plugin-updater",
  "dep:reqwest",
  "dep:notify",
  "dep:tokio",
]

[dependencies]
base64 = "0.22"
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
tauri = { version = "2.1.1", optional = true, features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = { version = "2.2.0", optional = true }
tauri-plugin-notification = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-updater = { version = "2.3.0", optional = true }
reqwest = { version = "0.12", optional = true, default-features = false, features = ["json", "rustls-tls", "blocking"] }
notify = { version = "6.1", optional = true }
tokio = { version = "1", optional = true, features = ["macros", "rt-multi-thread", "time"] }

[target.'cfg(windows)'.dependencies]
keyring = "3"
winreg = "0.52"

[build-dependencies]
tauri-build = { version = "2.0.3", features = [] }
